server {
    listen 80;
    server_name dacs2025.local;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    server_name dacs2025.local;

    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;

    root /usr/share/nginx/html;
    index index.html;
	
	
	# Bloque 1: Gateway para keycloack 'auth'
    # Las peticiones a 	https://dacs2025.local/auth/ se redirigirán a http://localhost:8080/auth/
    location /auth/ {
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme; # <--- CRÍTICO Informa a Keycloak que la petición es segura (HTTPS)
        proxy_pass http://keycloak:8080/auth/;
     }


    # Bloque 2: Gateway para bff 'api'
    location ~ ^/api/(.*) {
        # Reescribe la URL, eliminando el prefijo /api/
        rewrite ^/api/(.*)$ /bff/$1 break;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;	
        proxy_pass http://ms-bff:9001;
    }


	# Bloque 3: Servir la aplicación de Angular desde la raíz del dominio
    # Aquí Nginx buscará y servirá los archivos estáticos de la aplicación Angular.
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

	# Bloque 4: Servir la aplicación de Angular dacsapp 
    # Los archivos de esta app se servirán desde la carpeta 'web/dacsapp'.
    location /dacsapp/ {
        alias /usr/share/nginx/html/dacsapp/;
        index index.html;
        try_files $uri $uri/ /dacsapp/index.html;
    }
	
	# Bloque de configuración para la segunda aplicaciónde prueba.
    # Los archivos de esta app se servirán desde la carpeta 'web/dacshowcase'.
    location /dacshowcase/ {
        alias /usr/share/nginx/html/dacshowcase/;
        index index.html;
        try_files $uri $uri/ /dacshowcase/index.html;
    }
	
}